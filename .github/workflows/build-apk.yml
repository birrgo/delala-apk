name: Convert PWA to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Updated to v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory (Fixes the '.' error)
        run: |
          # Create a dedicated folder for Capacitor
          mkdir www
          # Copy your existing web files into the new www folder
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Install Android Packaging Tools
        run: |
          npm install @capacitor/core @capacitor/cli
          # Initialize Capacitor using the new 'www' folder instead of '.'
          npx cap init "hulum Gebeya" "com.hulumgebeya.app" --web-dir www
          npm install @capacitor/android
          npx cap add android

      - name: Generate App Icon from s.png
        run: |
          mkdir -p assets
          # Copies your s.png logo to be used as the app icon
          cp s.png assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: hulum-gebeya-apk
          path: android/app/build/outputs/apk/debug/*.apk
