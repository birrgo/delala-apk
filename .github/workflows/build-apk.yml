ntername: Convert PWA to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java (Updated to v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Directory
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Inject CSS Fix for Header Overlap
        run: |
          # Changed padding-top from 45px to 36px to slightly reduce the header height
          find www -type f -name "*.html" -exec sed -i 's|</head>|<style>.nav-header { padding-top: 36px !important; padding-bottom: 8px !important; }</style></head>|g' {} +

      - name: Install Android Packaging Tools & Plugins
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init "hulum Gebeya" "com.hulumgebeya.app" --web-dir www
          
          # Added @capacitor/app here to handle the back button
          npm install @capacitor/android @capacitor/status-bar @capacitor/app
          
          # Overwrite capacitor config to fix Status Bar overlap
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.hulumgebeya.app",
            "appName": "hulum Gebeya",
            "webDir": "www",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "backgroundColor": "#081B38"
              }
            }
          }
          EOF
          
          npx cap add android

      - name: Generate App Icon from s.png
        run: |
          mkdir -p assets
          cp s.png assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add Location Permissions to Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Insert GPS location permissions right before the <application> tag
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' $MANIFEST

      - name: Apply Custom Android Styles
        run: |
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#0F2C59</item>
                  <item name="colorPrimaryDark">#081B38</item>
                  <item name="colorAccent">#0F2C59</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:statusBarColor">#081B38</item>
                  <item name="android:fitsSystemWindows">true</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: hulum-gebeya-apk
          path: android/app/build/outputs/apk/debug/*.apk
