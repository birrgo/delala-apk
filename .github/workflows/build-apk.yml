name: Convert PWA to APK

on:
  push:
    branches: [ main ] # Triggers the build when you push to the main branch
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Packaging Tools
        run: |
          npm install @capacitor/core @capacitor/cli
          # Updated with your app name and a unique package ID
          npx cap init "hulum Gebeya" "com.hulumgebeya.app" --web-dir .
          npm install @capacitor/android
          npx cap add android

      - name: Generate App Icon from s.png
        run: |
          # Create the folder Capacitor expects for assets
          mkdir -p assets
          
          # Copy your logo to the required filename (icon.png)
          cp s.png assets/icon.png
          
          # Install the asset generator and create the Android icons
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
          
          # Sync the new icons into the Android project
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: hulum-gebeya-apk
          path: android/app/build/outputs/apk/debug/*.apk
